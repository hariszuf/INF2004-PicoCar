<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1000" height="720" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Buddy 5 – how the PicoCar passes the obstacle (top view)</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Car drives UP the page along the black line. Example shown: bypass on the RIGHT side.</text>

  <!-- track area -->
  <rect x="30" y="70" width="560" height="630" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>

  <!-- line -->
  <rect x="192" y="75" width="16" height="620" fill="#111827"/>
  <text x="200" y="692" text-anchor="middle" font-size="12" fill="#6b7280">black line</text>

  <!-- obstacle box -->
  <rect x="150" y="270" width="100" height="110" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <text x="200" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">OBSTACLE</text>
  <text x="200" y="342" text-anchor="middle" font-size="12" fill="#7f1d1d">(~20 cm box)</text>

  <!-- path -->
  <path d="M200 640 L200 470" stroke="#2563eb" stroke-width="4" fill="none" stroke-dasharray="2 0"/>
  <path d="M200 470 L200 470 L330 470 L330 190 L200 190" stroke="#16a34a" stroke-width="4" fill="none" stroke-dasharray="10 6"/>
  <path d="M200 190 L200 120" stroke="#2563eb" stroke-width="4" fill="none"/>
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 z" fill="#16a34a"/></marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 z" fill="#2563eb"/></marker>
  </defs>
  <path d="M200 640 L200 500" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#b)"/>
  <path d="M200 470 L330 470" stroke="#16a34a" stroke-width="4" fill="none" stroke-dasharray="10 6" marker-end="url(#a)"/>
  <path d="M330 470 L330 200" stroke="#16a34a" stroke-width="4" fill="none" stroke-dasharray="10 6" marker-end="url(#a)"/>
  <path d="M330 190 L215 190" stroke="#16a34a" stroke-width="4" fill="none" stroke-dasharray="10 6" marker-end="url(#a)"/>
  <path d="M200 190 L200 125" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#b)"/>

  <!-- scan fan -->
  <path d="M200 470 L110 395 A118 118 0 0 1 270 392 Z" fill="#fde68a" fill-opacity="0.55" stroke="#d97706" stroke-dasharray="4 3"/>

  <!-- car at stop -->
  <rect x="186" y="468" width="28" height="44" rx="5" fill="#1d4ed8"/>
  <circle cx="200" cy="472" r="4" fill="#fbbf24"/>

  <!-- circled steps -->
  <g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="165" cy="560" r="13" fill="#2563eb"/><text x="165" y="565">1</text>
    <circle cx="140" cy="440" r="13" fill="#d97706"/><text x="140" y="445">2</text>
    <circle cx="265" cy="500" r="13" fill="#7c3aed"/><text x="265" y="505">3</text>
    <circle cx="360" cy="330" r="13" fill="#16a34a"/><text x="360" y="335">4</text>
    <circle cx="355" cy="190" r="13" fill="#16a34a"/><text x="355" y="195">5</text>
    <circle cx="165" cy="150" r="13" fill="#2563eb"/><text x="165" y="155">6</text>
  </g>

  <!-- labels on map -->
  <text x="278" y="440" font-size="12" fill="#92400e">servo sweep</text>
  <text x="278" y="455" font-size="12" fill="#92400e">−35° … +25°</text>
  <text x="345" y="388" font-size="12" fill="#166534">pass beside box</text>
  <text x="345" y="403" font-size="12" fill="#166534">(box + car tail)</text>
  <text x="225" y="214" font-size="12" fill="#166534">sweep back to line</text>
  <text x="225" y="172" font-size="12" fill="#166534">IR sensors stop here</text>

  <!-- legend -->
  <line x1="45" y1="86" x2="85" y2="86" stroke="#2563eb" stroke-width="4"/><text x="92" y="90" font-size="12" fill="#374151">line following</text>
  <line x1="45" y1="106" x2="85" y2="106" stroke="#16a34a" stroke-width="4" stroke-dasharray="10 6"/><text x="92" y="110" font-size="12" fill="#374151">bypass path (encoders)</text>

  <!-- step list -->
  <g font-size="13" fill="#1f2937">
    <text x="615" y="96" font-size="16" font-weight="700">Steps</text>

    <circle cx="627" cy="124" r="11" fill="#2563eb"/><text x="627" y="128" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="647" y="120" font-weight="700">Detect &amp; stop</text>
    <text x="647" y="136" fill="#4b5563">Follows the line. Sonar sees the box</text>
    <text x="647" y="151" fill="#4b5563">(~20 cm ahead) → car stops.</text>

    <circle cx="627" cy="184" r="11" fill="#d97706"/><text x="627" y="188" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="647" y="180" font-weight="700">Scan</text>
    <text x="647" y="196" fill="#4b5563">Servo sweeps the sonar (13 points) to</text>
    <text x="647" y="211" fill="#4b5563">measure front distance, left/right edge, width.</text>

    <circle cx="627" cy="244" r="11" fill="#7c3aed"/><text x="627" y="248" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="647" y="240" font-weight="700">Choose side</text>
    <text x="647" y="256" fill="#4b5563">Nearer box edge / side with more room.</text>
    <text x="647" y="271" fill="#4b5563">If unsure: turns left &amp; right to look.</text>

    <circle cx="627" cy="304" r="11" fill="#16a34a"/><text x="627" y="308" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="647" y="300" font-weight="700">Sidestep &amp; pass</text>
    <text x="647" y="316" fill="#4b5563">Turn 90°, move sideways by the offset,</text>
    <text x="647" y="331" fill="#4b5563">check the path is clear, turn forward,</text>
    <text x="647" y="346" fill="#4b5563">drive past the box + car tail.</text>

    <circle cx="627" cy="380" r="11" fill="#16a34a"/><text x="627" y="384" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="647" y="376" font-weight="700">Return to line</text>
    <text x="647" y="392" fill="#4b5563">Turn back toward the line and drive until</text>
    <text x="647" y="407" fill="#4b5563">the IR sensors see it. Sonar checks the box</text>
    <text x="647" y="422" fill="#4b5563">is behind; if not, reverse a little and extend.</text>

    <circle cx="627" cy="456" r="11" fill="#2563eb"/><text x="627" y="460" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text>
    <text x="647" y="452" font-weight="700">Resume</text>
    <text x="647" y="468" fill="#4b5563">Pivot onto the line and continue line following.</text>

    <rect x="610" y="500" width="370" height="150" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="625" y="524" font-weight="700" fill="#92400e">Safety stops during the bypass</text>
    <text x="625" y="546" fill="#78350f">• Anything &lt;17 cm ahead on the pass → stop</text>
    <text x="625" y="564" fill="#78350f">• Both sides blocked → stop (no route)</text>
    <text x="625" y="582" fill="#78350f">• Still blocked after 4 extra turns → restart scan</text>
    <text x="625" y="600" fill="#78350f">• Line not found in 4 s → stop</text>
    <text x="625" y="618" fill="#78350f">• Lifting the car → all motors stop (IMU)</text>
    <text x="625" y="636" fill="#78350f">• Buddy 5 only asks; the controller drives</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
