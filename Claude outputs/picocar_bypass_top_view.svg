<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1565c0"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef6c00"/></marker>
  </defs>
  <rect width="900" height="900" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="bold" fill="#1a1a1a">PicoCar obstacle bypass, top view (what it is supposed to do)</text>
  <text x="24" y="54" fill="#555">Car drives up the page. Distances are approximate; car icon is not to scale.</text>

  <!-- white track strip and black line -->
  <rect x="385" y="70" width="70" height="810" fill="#f1f1f1" stroke="#d0d0d0"/>
  <line x1="420" y1="70" x2="420" y2="880" stroke="#111" stroke-width="7"/>

  <!-- scan fan from the sonar at the stop point -->
  <polygon points="420,742 280,442 630,442" fill="#fdd835" fill-opacity="0.28" stroke="#f9a825" stroke-dasharray="5 4"/>
  <text x="250" y="462" fill="#8d6e00">25° left</text>
  <text x="560" y="462" fill="#8d6e00">35° right</text>
  <text x="470" y="640" fill="#8d6e00">sonar scan</text>

  <!-- box -->
  <rect x="360" y="232" width="120" height="210" rx="6" fill="#b0bec5" stroke="#455a64" stroke-width="2"/>
  <text x="420" y="342" text-anchor="middle" font-weight="bold" fill="#263238">BOX</text>

  <!-- distance marker: stop distance -->
  <line x1="500" y1="442" x2="500" y2="742" stroke="#777" marker-start="url(#a)" marker-end="url(#a)" stroke-width="1"/>
  <text x="508" y="560" fill="#555">~500 mm</text>

  <!-- path -->
  <g fill="none" stroke="#1565c0" stroke-width="3.5" stroke-linecap="round">
    <line x1="420" y1="875" x2="420" y2="800" marker-end="url(#a)"/>
    <line x1="420" y1="790" x2="238" y2="790" marker-end="url(#a)"/>
    <line x1="228" y1="790" x2="228" y2="392" marker-end="url(#a)"/>
    <line x1="156" y1="382" x2="156" y2="272" marker-end="url(#a)"/>
    <line x1="156" y1="262" x2="156" y2="152" marker-end="url(#a)"/>
    <line x1="156" y1="142" x2="408" y2="142" marker-end="url(#a)"/>
    <line x1="420" y1="136" x2="420" y2="80" marker-end="url(#a)"/>
  </g>
  <!-- reverse step -->
  <line x1="228" y1="382" x2="166" y2="382" stroke="#ef6c00" stroke-width="3.5" stroke-dasharray="7 5" marker-end="url(#r)"/>

  <!-- sonar checks toward the line -->
  <line x1="170" y1="372" x2="356" y2="372" stroke="#c62828" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="262" y="364" text-anchor="middle" fill="#c62828">echo: box</text>
  <line x1="170" y1="262" x2="356" y2="262" stroke="#c62828" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="262" y="254" text-anchor="middle" fill="#c62828">echo: box</text>
  <line x1="170" y1="128" x2="380" y2="128" stroke="#2e7d32" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="270" y="120" text-anchor="middle" fill="#2e7d32">clear to the line</text>

  <!-- car at the stop point -->
  <rect x="398" y="752" width="44" height="66" rx="6" fill="#26a69a" stroke="#00695c" stroke-width="2"/>
  <circle cx="420" cy="752" r="4" fill="#f9a825" stroke="#8d6e00"/>

  <!-- step numbers -->
  <g font-weight="bold" fill="#fff" text-anchor="middle" font-size="13">
    <g><circle cx="462" cy="790" r="12" fill="#1565c0"/><text x="462" y="795">1</text></g>
    <g><circle cx="320" cy="772" r="12" fill="#1565c0"/><text x="320" y="777">2</text></g>
    <g><circle cx="246" cy="600" r="12" fill="#1565c0"/><text x="246" y="605">3</text></g>
    <g><circle cx="196" cy="402" r="12" fill="#ef6c00"/><text x="196" y="407">4</text></g>
    <g><circle cx="136" cy="322" r="12" fill="#1565c0"/><text x="136" y="327">5</text></g>
    <g><circle cx="136" cy="202" r="12" fill="#1565c0"/><text x="136" y="207">5</text></g>
    <g><circle cx="290" cy="160" r="12" fill="#1565c0"/><text x="290" y="165">6</text></g>
    <g><circle cx="442" cy="100" r="12" fill="#1565c0"/><text x="442" y="105">7</text></g>
  </g>

  <!-- legend -->
  <g fill="#1a1a1a">
    <rect x="640" y="80" width="244" height="356" rx="8" fill="#fafafa" stroke="#ddd"/>
    <text x="654" y="104" font-weight="bold">Steps</text>
    <text x="654" y="128"><tspan font-weight="bold">1</tspan>  Stop ~500 mm before the box</text>
    <text x="668" y="145" fill="#555">and scan left/right. No reverse.</text>
    <text x="654" y="169"><tspan font-weight="bold">2</tspan>  Turn to the side with more</text>
    <text x="668" y="186" fill="#555">room, drive box width + 6 cm</text>
    <text x="668" y="203" fill="#555">(more if the edge was not seen).</text>
    <text x="654" y="227"><tspan font-weight="bold">3</tspan>  Face forward, check the front</text>
    <text x="668" y="244" fill="#555">is clear, drive just past the</text>
    <text x="668" y="261" fill="#555">box's front face.</text>
    <text x="654" y="285"><tspan font-weight="bold">4</tspan>  Turn toward the line, reverse</text>
    <text x="668" y="302" fill="#555">12 cm, then look with the sonar.</text>
    <text x="654" y="326"><tspan font-weight="bold">5</tspan>  Box still there: face forward,</text>
    <text x="668" y="343" fill="#555">drive 20 cm further, look again.</text>
    <text x="668" y="360" fill="#555">Repeat until clear.</text>
    <text x="654" y="384"><tspan font-weight="bold">6</tspan>  Clear: drive to the line, sonar</text>
    <text x="668" y="401" fill="#555">watching ahead the whole way.</text>
    <text x="654" y="425"><tspan font-weight="bold">7</tspan>  Centre on the line and resume.</text>
  </g>
  <g>
    <line x1="654" y1="470" x2="694" y2="470" stroke="#1565c0" stroke-width="3.5"/><text x="704" y="474" fill="#1a1a1a">drive forward</text>
    <line x1="654" y1="494" x2="694" y2="494" stroke="#ef6c00" stroke-width="3.5" stroke-dasharray="7 5"/><text x="704" y="498" fill="#1a1a1a">reverse</text>
    <line x1="654" y1="518" x2="694" y2="518" stroke="#c62828" stroke-width="2" stroke-dasharray="3 3"/><text x="704" y="522" fill="#1a1a1a">sonar sees the box</text>
    <line x1="654" y1="542" x2="694" y2="542" stroke="#2e7d32" stroke-width="2" stroke-dasharray="3 3"/><text x="704" y="546" fill="#1a1a1a">sonar sees nothing</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
