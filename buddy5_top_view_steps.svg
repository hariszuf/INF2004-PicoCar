<text x="500" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Buddy 5 obstacle bypass - top view with real distances</text>
<text x="500" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Car drives UP the page. Distances in mm. Example: bypass on the RIGHT, sonar sees the box 330 mm ahead at the stop.</text>
<rect x="20" y="62" width="560" height="760" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
