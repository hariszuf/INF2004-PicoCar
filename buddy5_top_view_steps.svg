<circle cx="230.0" cy="276.99999999999994" r="107.80000000000001" fill="none" stroke="#dc2626" stroke-dasharray="5 4"/>
<text x="118.19999999999999" y="398.79999999999995" font-size="11" fill="#b91c1c">tail swing r=196</text>
<line x1="357.5" y1="640.0" x2="357.5" y2="414.5" stroke="#6b7280"/>
<circle cx="213.5" cy="706.0" r="12" fill="#2563eb"/><text x="213.5" y="711.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
<circle cx="164.0" cy="557.5" r="12" fill="#d97706"/><text x="164.0" y="562.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
<circle cx="276.75" cy="656.5" r="12" fill="#16a34a"/><text x="276.75" y="661.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
<circle cx="337.5" cy="497.0" r="12" fill="#16a34a"/><text x="337.5" y="502.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
<circle cx="301.5" cy="298.99999999999994" r="12" fill="#16a34a"/><text x="301.5" y="303.99999999999994" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
<circle cx="290.5" cy="246.99999999999994" r="12" fill="#7c3aed"/><text x="290.5" y="251.99999999999994" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text>
<circle cx="206.0" cy="216.49999999999994" r="12" fill="#2563eb"/><text x="206.0" y="221.49999999999994" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">7</text>
<text x="363.5" y="502.0" font-size="12" fill="#166534">pass: face + 250</text>
<text x="363.5" y="517.0" font-size="11" fill="#6b7280">(axle at f = 410+250 = 660)</text>
<text x="327.5" y="658.0" font-size="12" fill="#166534">sideways 170</text>
<text x="100.75" y="306.0" font-size="11" fill="#b91c1c">box rear at 560 = only 100 mm</text>
<text x="100.75" y="320.0" font-size="11" fill="#b91c1c">behind the axle at the turn</text>
<text x="263.0" y="678.25" font-size="11" fill="#92400e">stop here: sonar 330 from box</text>
<text x="230.0" y="812" text-anchor="middle" font-size="11" fill="#6b7280">black line</text>
<text x="605" y="90" font-size="16" font-weight="700" fill="#1f2937">What the car does</text>
<circle cx="616" cy="114" r="11" fill="#2563eb"/><text x="616" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
<text x="635" y="112" font-size="13" font-weight="700" fill="#1f2937">Follow line; sonar watches ahead</text>
<text x="635" y="128" font-size="11" fill="#4b5563">stop when box is within 350 mm (minus 28 overhang)</text>
<circle cx="616" cy="164" r="11" fill="#d97706"/><text x="616" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
<text x="635" y="162" font-size="13" font-weight="700" fill="#1f2937">Stop and scan</text>
<text x="635" y="178" font-size="11" fill="#4b5563">wheels still, origin = (0,0). Servo -35..+25 deg, 5 deg steps, 13 points</text>
<circle cx="616" cy="214" r="11" fill="#16a34a"/><text x="616" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
<text x="635" y="212" font-size="13" font-weight="700" fill="#1f2937">Turn 90 deg and go sideways 170</text>
<text x="635" y="228" font-size="11" fill="#4b5563">side chosen from scan (or pivot look 30..75 deg if edges unseen)</text>
<circle cx="616" cy="264" r="11" fill="#16a34a"/><text x="616" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
<text x="635" y="262" font-size="13" font-weight="700" fill="#1f2937">Turn forward, check path, drive past</text>
<text x="635" y="278" font-size="11" fill="#4b5563">wait 500 ms, sonar must see clear; then drive to box face + 250</text>
<circle cx="616" cy="314" r="11" fill="#16a34a"/><text x="616" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
<text x="635" y="312" font-size="13" font-weight="700" fill="#1f2937">Turn 90 deg toward the line</text>
<text x="635" y="328" font-size="11" fill="#4b5563">no reverse; 3 sonar looks (ahead / half back / back)</text>
<circle cx="616" cy="364" r="11" fill="#7c3aed"/><text x="616" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text>
<text x="635" y="362" font-size="13" font-weight="700" fill="#1f2937">Blocked? extend 60 mm and re-check</text>
<text x="635" y="378" font-size="11" fill="#4b5563">only if the box is still beside; up to 8 times</text>
<circle cx="616" cy="414" r="11" fill="#2563eb"/><text x="616" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">7</text>
<text x="635" y="412" font-size="13" font-weight="700" fill="#1f2937">Sweep to the line, rejoin, resume</text>
<text x="635" y="428" font-size="11" fill="#4b5563">IR finds tape (up to 100 mm past), junction-style turn, line following</text>
<rect x="600" y="473" width="385" height="200" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
<text x="613" y="496" font-size="12" font-weight="700" fill="#92400e">Setup / safety</text>
<text x="613" y="518" font-size="12" font-weight="400" fill="#78350f">- Box centred on the line, 100 mm side across the line</text>
<text x="613" y="540" font-size="12" font-weight="400" fill="#78350f">- Keep 40 cm+ free on both sides of the line</text>
<text x="613" y="562" font-size="12" font-weight="400" fill="#78350f">- Anything under 170 mm ahead during the pass: stop</text>
<text x="613" y="584" font-size="12" font-weight="400" fill="#78350f">- Both sides blocked: stop (no route)</text>
<text x="613" y="606" font-size="12" font-weight="400" fill="#78350f">- Lift the car: all motors stop</text>
<text x="613" y="628" font-size="12" font-weight="400" fill="#b91c1c">- Heads-up: at pass = 250 past the face the tail swing</text>
<text x="613" y="650" font-size="12" font-weight="400" fill="#b91c1c">  (196 mm) clips the box in simulation. 400 is clean.</text>
